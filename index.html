<script>

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
}
function uid() { return 'PT-' + Date.now() + '-' + Math.random().toString(36).slice(2,7); }

// =====================================================================
// AUTH + LOAD
// =====================================================================
// Standalone home-screen mode on iOS hides the browser's own reload
// control entirely, so this button is the only way to force a fresh fetch
// from inside the app itself. Appending a changing query param (rather
// than a plain reload) means the URL is technically different every time,
// which forces a genuine re-fetch instead of relying on the browser to
// decide the cached copy is stale.
function forceRefresh() {
  const url = new URL(window.location.href);
  url.searchParams.set('_r', Date.now());
  window.location.href = url.toString();
}

function setAuthStatus(msg) { document.getElementById('authStatus').textContent = msg; }

function setSaveStatus(state, text) {
  const dot = document.getElementById('saveStatusDot');
  const label = document.getElementById('saveStatusText');
  if (!dot || !label) return;
  const colors = { saved: '#4ADE80', saving: '#fbbf24', error: '#f87171', off: 'rgba(255,255,255,0.3)' };
  dot.style.background = colors[state] || colors.off;
  label.textContent = text;
  label.style.color = state === 'off' ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.7)';
}

async function ensureToken() {
  if (gdriveToken) return;
  await new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => {
        if (r.access_token) { gdriveToken = r.access_token; resolve(); }
        else reject(new Error(r.error || 'Sign-in failed'));
      },
      error_callback: e => reject(new Error(e.message || 'Sign-in failed'))
    });
    client.requestAccessToken({ prompt: '' });
  });
}

// Same in-flight-promise-caching pattern used across every other Field
// Tools form's getOrCreateClientFolder, to avoid the duplicate-folder race
// condition already fixed elsewhere in the suite.
const _folderCache = {};
async function getOrCreateFolder(parentId, name) {
  const key = parentId + '::' + name;
  if (_folderCache[key]) return _folderCache[key];
  _folderCache[key] = (async () => {
    const sr = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`,
      { headers: { Authorization: `Bearer ${gdriveToken}` } }
    );
    if (!sr.ok) throw new Error(`Folder search failed (${sr.status})`);
    const sd = await sr.json();
    if (sd.files && sd.files.length) return sd.files[0].id;
    const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
    });
    if (!cr.ok) throw new Error(`Folder creation failed (${cr.status})`);
    const created = await cr.json();
    if (!created.id) throw new Error('Folder creation returned no ID');
    return created.id;
  })();
  try { return await _folderCache[key]; }
  catch (e) { delete _folderCache[key]; throw e; }
}

// list is kept only as an unused reference (it returns before reaching it).
function getSeedProspects() {
  return [];
  const today = todayStr();
  const plus7 = addDays(today, 7);
  return [
    { id: uid(), company:'Varley Transport', state:'WA', contactName:'', contactPhone:'', contactEmail:'',
      bdm:'Michael Hodnett', status:'New Lead', activity:[], nextFollowUp:null, lostReason:null, createdDate:today, clientId:null },
    { id: uid(), company:'Sands Refrigeration', state:'WA', contactName:'', contactPhone:'', contactEmail:'',
      bdm:'Michael Hodnett', status:'Quoted', activity:[
        {date:today,type:'email',text:'Cold-call email sent'},
        {date:today,type:'call',text:'Follow-up call made'},

let _adminSheetIdCache = null;
async function getOrCreateAdminSheetId(rootFolderId) {
  if (_adminSheetIdCache) return _adminSheetIdCache;
  const adminFolderId = await getOrCreateFolder(rootFolderId, 'ADMIN DATA - DO NOT REMOVE');
  const sr = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${CLIENT_RECORDS_NAME}' and '${adminFolderId}' in parents and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const sd = await sr.json();
  if (sd.files && sd.files.length) { _adminSheetIdCache = sd.files[0].id; return _adminSheetIdCache; }

  // Not found — create a fresh workbook with the correct columns, same
  // structure the Prospect/Client form creates if it gets there first.
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([CLIENT_RECORDS_HEADERS]);
  XLSX.utils.book_append_sheet(wb, ws, 'Client Records');
  const nws = XLSX.utils.aoa_to_sheet([['Client ID','Billing Entity','Site Name','Timestamp','Form','BDM','Notes']]);
  XLSX.utils.book_append_sheet(wb, nws, 'Notes Log');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({ name: CLIENT_RECORDS_NAME, parents: [adminFolderId] })], { type: 'application/json' }));
  form.append('file', blob);
  const cr = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST', headers: { Authorization: `Bearer ${gdriveToken}` }, body: form
  });
  _adminSheetIdCache = (await cr.json()).id;
  return _adminSheetIdCache;
}

async function getDriveRootId() {
  const rf = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const rd = await rf.json();
  if (rd.files && rd.files.length) return rd.files[0].id;
  const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  return (await cr.json()).id;
}

// Mints a Client ID + Drive folder (inside Prospects/) the first time a
// quote is needed for this lead, and writes a Client Records row with
// 'Prospect ✓' already set — so Quote Builder's existing gate passes
// with zero changes to that file. Returns the new Client ID.
async function mintClientId(p) {
  const rootId = await getDriveRootId();
  const prospectsId = await getOrCreateFolder(rootId, PROSPECTS_FOLDER);
  const folderName = (p.company || 'Unnamed').slice(0, 50);
  const clientFolderId = await getOrCreateFolder(prospectsId, folderName);

  const sheetId = await getOrCreateAdminSheetId(rootId);
  const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  const ab = await dl.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
  const ws = wb.Sheets['Client Records'];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = rows[0] || CLIENT_RECORDS_HEADERS;

  const idCol = headers.indexOf('Client ID');
  const existingIds = rows.slice(1).map(r => r[idCol]).filter(Boolean);
  const maxId = existingIds.reduce((m, id) => { const n = parseInt((id + '').replace('BB-', '')); return isNaN(n) ? m : (n > m ? n : m); }, 0);
  const newId = `BB-${String(maxId + 1).padStart(4, '0')}`;

  const targetRow = new Array(headers.length).fill('');
  const set = (col, val) => { const i = headers.indexOf(col); if (i > -1) targetRow[i] = val; };
  set('Client ID', newId);
  set('Billing Entity', p.company || '');
  set('Descriptor', p.descriptor || '');
  set('Street Address', p.streetAddress || '');
  set('Suburb', p.suburb || '');
  set('State', p.state || '');
  set('Postcode', p.postcode || '');
  set('Product Interest', p.productInterest || '');
  set('Current Supplier', p.currentSupplier || '');
  set('Estimated Volume', p.estimatedVolumeLitres ? `${p.estimatedVolumeLitres}L per ${p.estimatedVolumePeriod === 'annum' ? 'annum' : 'month'}` : '');
  set('Business Contact Name', p.contactName || '');
  set('Business Contact Role', p.contactRole || '');
  set('Business Contact Email', p.contactEmail || '');
  set('Business Contact Phone', p.contactPhone || '');
  set('KDM Name', p.contact2Name || '');
  set('KDM Role', p.contact2Role || '');
  set('KDM Email', p.contact2Email || '');
  set('KDM Phone', p.contact2Phone || '');
  set('Other Contact Label', p.contact3Label || '');
  set('Other Contact Name', p.contact3Name || '');
  set('Other Contact Role', p.contact3Role || '');
  set('Other Contact Email', p.contact3Email || '');
  set('Other Contact Phone', p.contact3Phone || '');
  set('BDM Email', BDM_EMAILS[p.bdm] || BDM_EMAILS['Michael Hodnett']);
  set('Prospect \u2713', '\u2713');
  set('Record Status', 'Prospect');
  set('Drive Folder ID', clientFolderId);
  set('Created Date', todayStr());
  set('Created By', p.bdm || 'Michael Hodnett');

  rows.push(targetRow);
  const newWs = XLSX.utils.aoa_to_sheet(rows);
  const newWb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWb, newWs, 'Client Records');
  if (wb.Sheets['Notes Log']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Notes Log'], 'Notes Log');
  const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
  });

  return newId;
}

// =====================================================================
// LIVE SYNC — once a lead has a Client ID, edits to the fields below
// push straight into that lead's *existing* Client Records row instead
// of going stale until the next quote/audit touches it. Deliberately
// narrow: only the columns the Tracker is the source of truth for
// (company/address/product interest/contacts). Everything else in the
// row — doc numbers, Drive Folder ID, Trackpod/Generated Site Name,
// POD emails, Record Status, etc. — is read back and rewritten
// untouched, so Quote Builder/Audit/Admin edits are never clobbered.
// Stops at Won: from then on the Prospect/Client form owns the client
// record, so Tracker edits no longer push into Client Records.
// =====================================================================
const CLIENT_RECORD_SYNCED_FIELDS = new Set([
  'company', 'descriptor', 'streetAddress', 'suburb', 'state', 'postcode',
  'productInterest', 'currentSupplier', 'estimatedVolumeLitres', 'estimatedVolumePeriod',
  'contactName', 'contactRole', 'contactEmail', 'contactPhone',
  'contact2Name', 'contact2Role', 'contact2Email', 'contact2Phone',
  'contact3Label', 'contact3Name', 'contact3Role', 'contact3Email', 'contact3Phone'
]);

// Writes the Tracker-owned fields from `p` into `row` (an existing
// Client Records row array), using the same header lookups as
// mintClientId so the two never drift apart. Used by the live sync below.
function applyProspectToClientRow(p, row, headers) {
  while (row.length < headers.length) row.push('');
  const set = (col, val) => { const i = headers.indexOf(col); if (i > -1) row[i] = val; };
  set('Billing Entity', p.company || '');
  set('Descriptor', p.descriptor || '');
  set('Street Address', p.streetAddress || '');
  set('Suburb', p.suburb || '');
  set('State', p.state || '');
  set('Postcode', p.postcode || '');
  set('Product Interest', p.productInterest || '');
  set('Current Supplier', p.currentSupplier || '');
  set('Estimated Volume', p.estimatedVolumeLitres ? `${p.estimatedVolumeLitres}L per ${p.estimatedVolumePeriod === 'annum' ? 'annum' : 'month'}` : '');
  set('Business Contact Name', p.contactName || '');
  set('Business Contact Role', p.contactRole || '');
  set('Business Contact Email', p.contactEmail || '');
  set('Business Contact Phone', p.contactPhone || '');
  set('KDM Name', p.contact2Name || '');
  set('KDM Role', p.contact2Role || '');
  set('KDM Email', p.contact2Email || '');
  set('KDM Phone', p.contact2Phone || '');
  set('Other Contact Label', p.contact3Label || '');
  set('Other Contact Name', p.contact3Name || '');
  set('Other Contact Role', p.contact3Role || '');
  set('Other Contact Email', p.contact3Email || '');
  set('Other Contact Phone', p.contact3Phone || '');
  return row;
}

// Downloads Client Records once, patches every prospect in `list` that
// has a matching row (by Client ID), and writes back once — so editing
// several leads in a row (or the bulk backfill) doesn't do a
// download/upload round-trip per lead.
async function pushProspectsToClientRecords(list) {
  if (!list.length) return;
  if (!gdriveToken) { const ok = await ensureConnected(); if (!ok) throw new Error('Not connected'); }
  const rootId = await getDriveRootId();
  const sheetId = await getOrCreateAdminSheetId(rootId);
  const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  if (!dl.ok) throw new Error('Client Records download failed (' + dl.status + ')');
  const ab = await dl.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
  const ws = wb.Sheets['Client Records'];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
  const headers = rows[0] || CLIENT_RECORDS_HEADERS;
  const idCol = headers.indexOf('Client ID');

  let changed = false;
  const missing = [];
  for (const p of list) {
    const rowIdx = rows.findIndex((r, i) => i > 0 && r[idCol] === p.clientId);
    if (rowIdx === -1) { missing.push(p.company || p.clientId); continue; }
    rows[rowIdx] = applyProspectToClientRow(p, rows[rowIdx], headers);
    changed = true;
  }
  if (!changed) {
    if (missing.length) throw new Error(`No Client Records row found for: ${missing.join(', ')}`);
    return;
  }

  const newWs = XLSX.utils.aoa_to_sheet(rows);
  const newWb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(newWb, newWs, 'Client Records');
  if (wb.Sheets['Notes Log']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Notes Log'], 'Notes Log');
  const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const up = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
  });
  if (!up.ok) throw new Error('Client Records upload failed (' + up.status + ')');
  if (missing.length) throw new Error(`Saved, but no Client Records row found for: ${missing.join(', ')}`);
}

// Single-flight queue, mirrors saveTracker()'s coalescing pattern: a
// burst of field edits (e.g. tabbing through several contact fields)
// collapses into one download/upload instead of one per field.
let clientSyncInFlight = false;
let clientSyncQueueIds = new Set();
async function queueClientRecordSync(p) {
  clientSyncQueueIds.add(p.id);
  if (clientSyncInFlight) return;
  clientSyncInFlight = true;
  try {
    while (clientSyncQueueIds.size) {
      const ids = Array.from(clientSyncQueueIds);
      clientSyncQueueIds.clear();
      const batch = ids.map(findProspect).filter(x => x && x.clientId && x.status !== 'Won');
      if (batch.length) await pushProspectsToClientRecords(batch);
    }
  } catch (e) {
    showToast('\u26A0\uFE0F Client record sync failed \u2014 ' + e.message);
  } finally {
    clientSyncInFlight = false;
  }
}

// =====================================================================
// =====================================================================
// TAP-TO-CALL — iOS never auto-links a phone number sitting inside a
// text input (only in plain rendered text), and these fields need to
// stay editable, so a small tel: link sits next to each phone field
// instead of replacing the input. Reads the input's current value at
// tap time rather than baking a static href, so an unsaved edit still
// dials correctly.
function callPhoneField(linkEl) {
  const input = linkEl.previousElementSibling;
  const raw = (input?.value || '').trim();
  if (!raw) { showToast('\u26A0\uFE0F No phone number entered'); return; }
  const cleaned = raw.replace(/[^\d+]/g, '');
  if (!cleaned) { showToast('\u26A0\uFE0F No phone number entered'); return; }
  window.location.href = 'tel:' + cleaned;
}

// SAVE CONTACT TO PHONE (vCard) — ported from the Prospect/Client form's
// working implementation, not rebuilt from scratch. The iOS handling below
// is the hard-won part: forcing a `download` attribute makes iOS Safari
// save the file into the Files app instead of offering to add it as a
// contact, so iOS gets a direct navigation to the blob URL instead, which
// hands off to the native Add Contact sheet correctly. Also carried over:
// every save fires from a real tap on its own button, never a timer —
// mobile browsers can silently block a download that isn't a direct user
// gesture, which is exactly what broke the original single-button version.
// =====================================================================
function generateVCardFile(name, role, phone, email, company, address, note) {
  if (!name) return;
  const nameParts = name.split(' ');
  const firstName = nameParts[0] || '';
  const lastName = nameParts.slice(1).join(' ') || '';
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:' + name,
    'N:' + lastName + ';' + firstName + ';;;',
    company ? 'ORG:' + company : '',
    role    ? 'TITLE:' + role  : '',
    phone   ? 'TEL;TYPE=CELL:' + phone : '',
    email   ? 'EMAIL:' + email : '',
    address ? 'ADR;TYPE=WORK:;;' + address : '',
    note    ? 'NOTE:' + note   : '',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');
  const blob = new Blob([lines], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    window.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } else {
    const a = document.createElement('a');
    a.href = url;
    a.download = name.replace(/\s+/g, '_') + '.vcf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
}

function saveContactVCard(id, slot) {
  const p = findProspect(id);
  if (!p) return;
  const address = [p.streetAddress, p.suburb, p.state, p.postcode].filter(Boolean).join(', ');
  const note = 'BioBlue prospect contact \u2014 ' + (p.company || '') + '. Added by ' + (p.bdm || '') + '.';
  if (slot === 1) generateVCardFile(p.contactName, p.contactRole, p.contactPhone, p.contactEmail, p.company, address, note);
  else if (slot === 2) generateVCardFile(p.contact2Name, p.contact2Role, p.contact2Phone, p.contact2Email, p.company, address, note);
  else if (slot === 3) generateVCardFile(p.contact3Name, p.contact3Label, p.contact3Phone, p.contact3Email, p.company, address, note);
}

// Drive keeps a folder's ID stable across a parent change — this is a
// genuine move, not a delete-and-recreate, so the Drive Folder ID already
// stored in Client Records, and any direct link to it, keeps working.
async function moveFolderToClients(folderId) {
  const rootId = await getDriveRootId();
  const clientsId = await getOrCreateFolder(rootId, CLIENTS_FOLDER);
  const meta = await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?fields=parents`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  const metaData = await meta.json();
  const currentParents = (metaData.parents || []).join(',');
  await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?addParents=${clientsId}&removeParents=${currentParents}`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}` }
  });
}

// Mirrors moveFolderToClients exactly, just to the Lost subfolder instead —
// keeps Prospects/ clean of dead deals the same way Won keeps it clean of
// converted ones. Same stable-ID guarantee: this is a parent change, not a
// delete-and-recreate, so the stored Drive Folder ID stays valid.
async function moveFolderToLost(folderId) {
  const rootId = await getDriveRootId();
  const lostId = await getOrCreateFolder(rootId, LOST_FOLDER);
  const meta = await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?fields=parents`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  const metaData = await meta.json();
  const currentParents = (metaData.parents || []).join(',');
  await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?addParents=${lostId}&removeParents=${currentParents}`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}` }
  });
}

// Primary forward action from the tracker. If this lead already has a
// Client ID (a quote was generated before), just opens Quote Builder
// against it. Otherwise mints one first — the only Drive-folder-creating
// action in the whole tracker, deliberately deferred until a quote is
// actually needed so leads that go nowhere never create Drive clutter.
async function generateQuote(id) {
  const p = findProspect(id);
  if (!p) return;
  try {
    if (!p.clientId) {
      // Suburb and Descriptor are required on the Prospect/Client form —
      // not blocking here (a BDM may genuinely not have this yet from a
      // first call), just a heads-up on what'll need filling in before
      // that form can be submitted. Shown before the mint work starts so
      // there's time to actually see it before the redirect happens.
      const missing = [];
      if (!p.suburb) missing.push('Suburb');
      if (!p.descriptor) missing.push('Descriptor');
      if (missing.length) showToast(`\u26A0\uFE0F Missing ${missing.join(' & ')} \u2014 required later on the client form`);

      await ensureToken();
      showToast('Setting up client record...');
      p.clientId = await mintClientId(p);
      if (p.status === 'New Lead' || p.status === 'Contacted') p.status = 'Engaged';
      saveTracker();
    }
    window.location.href = `${QUOTE_BUILDER_URL}/?client=${encodeURIComponent(p.clientId)}&name=${encodeURIComponent(p.company)}`;
  } catch (e) {
    showToast('\u26A0\uFE0F Could not set up client record — ' + e.message);
  }
}

async function getTrackerFileId() {
  if (trackerFileId) return trackerFileId;
  const rootId = await getDriveRootId();

  const adminId   = await getOrCreateFolder(rootId, 'ADMIN DATA - DO NOT REMOVE');
  const trackerId = await getOrCreateFolder(adminId, TRACKER_SUBFOLDER);

  const fr = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${TRACKER_FILE_NAME}' and '${trackerId}' in parents and trashed=false&fields=files(id)`,
    { headers: { Authorization: `Bearer ${gdriveToken}` } }
  );
  const fd = await fr.json();
  if (fd.files && fd.files.length) { trackerFileId = fd.files[0].id; return trackerFileId; }

  // Not found — create a fresh file (empty in live — see getSeedProspects
  // above). This branch only ever runs once, the moment the file doesn't
  // exist yet in Drive.
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({ name: TRACKER_FILE_NAME, parents: [trackerId] })], { type: 'application/json' }));
  form.append('file', new Blob([JSON.stringify(getSeedProspects())], { type: 'application/json' }));
  const cr = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST', headers: { Authorization: `Bearer ${gdriveToken}` }, body: form
  });
  const cd = await cr.json();
  trackerFileId = cd.id;
  return trackerFileId;
}

// Resolves gdriveToken + trackerFileId. Idempotent — if already connected
// this session, returns instantly without a network call or a repeat
// Google sign-in popup.
async function connectDrive() {
  if (gdriveToken && trackerFileId) return true;
  try {
    setAuthStatus('\uD83D\uDD10 Connecting to Google...');
    await ensureToken();
    setAuthStatus('\uD83D\uDCC2 Locating your data...');
    await getTrackerFileId();
    return true;
  } catch (e) {
    gdriveToken = null;
    setAuthStatus('\u274C ' + e.message);
    return false;
  }
}

// Fetches the Drive copy and merges it with whatever's in memory. The
// merge matters: if a BDM has already added a lead locally (e.g. their
// very first action this session, before any connection existed), that
// entry won't be in the Drive copy yet — this keeps it rather than letting
// the Drive fetch silently replace it. Always a real fetch, unlike
// connectDrive() which short-circuits once already connected — this is
// what makes Load useful as an explicit "pull the latest" even mid-session.
async function fetchAndMergeProspects() {
  const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${trackerFileId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  if (!dl.ok) throw new Error('Fetch failed (' + dl.status + ')');
  const text = await dl.text();
  const driveProspects = text.trim() ? JSON.parse(text) : [];
  const driveIds = new Set(driveProspects.map(p => p.id));
  const localOnly = prospects.filter(p => !driveIds.has(p.id));
  prospects = [...localOnly, ...driveProspects];
  setAuthStatus(`\u2705 ${prospects.length} prospect${prospects.length!==1?'s':''} loaded`);
  render();
}

// Explicit Load button — connect if needed, then always refresh, so it
// doubles as "pick up anything a teammate added" even once already
// connected, not just a first-time bootstrap step.
async function loadTracker() {
  setSaveStatus('saving', 'Connecting...');
  const ok = await connectDrive();
  if (!ok) { setSaveStatus('error', 'Not connected \u2014 tap Load to retry'); return; }
  try {
    await fetchAndMergeProspects();
    setSaveStatus('saved', 'Connected \u2014 edits save automatically');
  } catch (e) {
    setAuthStatus('\u274C ' + e.message);
    setSaveStatus('error', 'Not connected \u2014 tap Load to retry');
  }
}

// Auto-connect gate, called from inside saveTracker() itself — this is
// what makes the app "BDM-proof": no one needs to remember to tap Load
// before their first edit. First save of the session pays the cost of a
// real connect + safe merge-fetch; every save after that in the same
// session is already connected, so this returns instantly.
async function ensureConnected() {
  if (gdriveToken && trackerFileId) return true;
  const ok = await connectDrive();
  if (!ok) return false;
  try {
    await fetchAndMergeProspects();
    return true;
  } catch (e) {
    setAuthStatus('\u274C ' + e.message);
    return false;
  }
}

async function saveTracker() {
  const connected = await ensureConnected();
  if (!connected) {
    setSaveStatus('error', 'Not connected \u2014 will retry on your next edit');
    showToast('\u26A0\uFE0F Could not connect to Drive \u2014 will retry automatically');
    return false;
  }
  // Coalesce rapid successive saves (e.g. two quick taps) into one write —
  // last state always wins, matches the documented storage limitation.
  if (saveInFlight) { saveQueued = true; return true; }
  saveInFlight = true;
  setSaveStatus('saving', 'Saving...');
  let ok = false;
  try {
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${trackerFileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(prospects)
    });
    if (!res.ok) throw new Error('Save failed (' + res.status + ')');
    setSaveStatus('saved', 'Saved \u2014 ' + new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }));
    ok = true;
  } catch (e) {
    setSaveStatus('error', 'Save failed \u2014 will retry on your next edit');
    showToast('\u26A0\uFE0F Save failed — ' + e.message);
  } finally {
    saveInFlight = false;
    if (saveQueued) { saveQueued = false; saveTracker(); }
  }
  return ok;
}

// Explicit manual save for the Save button — auto-save already fires on
// every field edit, this is purely for peace of mind: tap it, get a direct
// yes/no. Reuses saveTracker() rather than duplicating the write logic, so
// there's still only one place that actually talks to Drive.
async function manualSave() {
  const ok = await saveTracker();
  if (ok) showToast('\u2705 Saved');
}

// =====================================================================
// NOTES LOG SYNC — every call/email/note gets written to the same Notes
// Log sheet the Prospect/Client form already uses for client conversations,
// so prospect conversations are exportable the same way. Runs as a strict
// queue (not in parallel) so two rapid taps can't read-modify-write over
// each other and silently drop one entry. Before a Client ID exists, the
// Tracker's own id stands in for it in the Client ID column.
// =====================================================================
let _notesLogQueue = Promise.resolve();
function syncActivityToNotesLog(p, activityText) {
  _notesLogQueue = _notesLogQueue
    .then(() => doSyncActivityToNotesLog(p, activityText))
    .catch(() => showToast('\u26A0\uFE0F Could not sync to Notes Log \u2014 saved locally, will retry next action'));
  return _notesLogQueue;
}

async function doSyncActivityToNotesLog(p, activityText) {
  await ensureToken();
  const rootId = await getDriveRootId();
  const sheetId = await getOrCreateAdminSheetId(rootId);
  const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
  if (!dl.ok) throw new Error('Notes Log download failed (' + dl.status + ')');
  const ab = await dl.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });

  const notesRows = wb.Sheets['Notes Log']
    ? XLSX.utils.sheet_to_json(wb.Sheets['Notes Log'], { header: 1 })
    : [['Client ID', 'Billing Entity', 'Site Name', 'Timestamp', 'Form', 'BDM', 'Notes']];
  notesRows.push([p.clientId || p.id, p.company, p.company, new Date().toISOString(), 'Prospect Tracker', p.bdm || 'Michael Hodnett', activityText]);
  const newNotesWs = XLSX.utils.aoa_to_sheet(notesRows);

  const newWb = XLSX.utils.book_new();
  if (wb.Sheets['Client Records']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Client Records'], 'Client Records');
  XLSX.utils.book_append_sheet(newWb, newNotesWs, 'Notes Log');
  const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const up = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
    method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
  });
  if (!up.ok) throw new Error('Notes Log upload failed (' + up.status + ')');
}

function findProspect(id) { return prospects.find(p => p.id === id); }

function logActivity(id, type, text) {
  const p = findProspect(id);
  if (!p) return;
  p.activity.push({ date: todayStr(), type, text });
  // Bump New Lead -> Contacted automatically on first real activity.
  if (type === 'visit' && (p.status === 'New Lead' || p.status === 'Contacted')) p.status = 'Engaged';
  else if (p.status === 'New Lead' && (type === 'email' || type === 'call')) p.status = 'Contacted';
  // Suggest next follow-up 7 days out unless one is already set in the future.
  const suggested = addDays(todayStr(), 7);
  if (!p.nextFollowUp || p.nextFollowUp < todayStr()) p.nextFollowUp = suggested;
  saveTracker();
  render();
  // Logged locally above (never lost even if this fails) — now sync to the
  // shared spreadsheet in the background so it's exportable.
  syncActivityToNotesLog(p, text);
}

// A native prompt() is deliberate here — it adds zero permanent UI (nothing
// sits on the card taking up space), only appearing at the exact moment
// you tap Call made / Email sent. Leaving it blank (or cancelling) still
// logs the tap itself, just with the old generic text, so the fast one-tap
// workflow is unchanged when there's genuinely nothing more to note.
function quickLogCall(id) {
  const notes = prompt('What was discussed? (optional — leave blank to just log the call)');
  const text = (notes && notes.trim()) ? `Call made \u2014 ${notes.trim()}` : 'Follow-up call made';
  logActivity(id, 'call', text);
}
function quickLogEmail(id) {
  const notes = prompt('Any notes on this email? (optional — leave blank to just log it)');
  const text = (notes && notes.trim()) ? `Email sent \u2014 ${notes.trim()}` : 'Cold-call email sent';
  logActivity(id, 'email', text);
}
function quickLogVisit(id) {
  const notes = prompt('How did the visit go? (optional — leave blank to just log it)');
  const text = (notes && notes.trim()) ? `F2F visit \u2014 ${notes.trim()}` : 'Face-to-face visit made';
  logActivity(id, 'visit', text);
}

function addNote(id, inputEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  logActivity(id, 'note', text);
  inputEl.value = '';
}

function changeStatus(id, newStatus) {
  const p = findProspect(id);
  if (!p) return;
  if (newStatus === 'Lost') { openLostModal(id); return; }
  const wasWon = p.status === 'Won';
  p.status = newStatus;
  saveTracker();
  render();
  // Won is the trigger to move the Drive folder out of Prospects/ into
  // Clients/ — only fires once, and only if a folder actually exists yet
  // (a lead could reach Won without ever generating a quote, e.g. if
  // Michael onboards them directly via Complete Client Details instead).
  if (newStatus === 'Won' && !wasWon && p.clientId) {
    ensureToken().then(() => moveClientFolderOnWon(p)).catch(() => {
      showToast('\u26A0\uFE0F Could not move folder to Clients — tap Won again to retry');
    });
    // Closes the loop the hard-gate message in promoteToClient() points
    // to — the moment Won is actually set, offer the direct next step
    // rather than relying on remembering to come back and tap Complete
    // Client Details separately.
    const goNow = confirm(`${p.company} marked Won.\n\nContinue straight to the client form to complete the remaining details now?`);
    if (goNow) {
      window.location.href = `${PROSPECT_FORM_URL}/?client=${encodeURIComponent(p.clientId)}&name=${encodeURIComponent(p.company)}`;
    }
  }
}

async function moveClientFolderOnWon(p) {
  try {
    const rootId = await getDriveRootId();
    const sheetId = await getOrCreateAdminSheetId(rootId);
    const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
    const ab = await dl.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
    const ws = wb.Sheets['Client Records'];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    const headers = rows[0] || [];
    const idCol = headers.indexOf('Client ID');
    const folderCol = headers.indexOf('Drive Folder ID');
    const custCol = headers.indexOf('Customer \u2713');
    const rowIdx = rows.findIndex((r, i) => i > 0 && (r[idCol] || '') === p.clientId);
    if (rowIdx === -1) return;
    const folderId = rows[rowIdx][folderCol];
    if (folderId) await moveFolderToClients(folderId);
    if (custCol > -1) rows[rowIdx][custCol] = '\u2713';
    const newWs = XLSX.utils.aoa_to_sheet(rows);
    const newWb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(newWb, newWs, 'Client Records');
    if (wb.Sheets['Notes Log']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Notes Log'], 'Notes Log');
    const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
      method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
    });
    showToast('Moved to Clients folder');
  } catch (e) {
    showToast('\u26A0\uFE0F Folder move failed — ' + e.message);
  }
}

// Mirrors moveClientFolderOnWon exactly — same lookup, same write pattern —
// but moves to Lost/ and writes Record Status instead of Customer ✓. Only
// fires if a Client ID already exists (a quote was generated before this
// fell through); a lead marked Lost before ever reaching that point has no
// folder or Client Records row to touch, so there's nothing to sync.
async function moveClientFolderOnLost(p) {
  try {
    const rootId = await getDriveRootId();
    const sheetId = await getOrCreateAdminSheetId(rootId);
    const dl = await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?alt=media`, { headers: { Authorization: `Bearer ${gdriveToken}` } });
    const ab = await dl.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
    const ws = wb.Sheets['Client Records'];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    const headers = rows[0] || [];
    const idCol = headers.indexOf('Client ID');
    const folderCol = headers.indexOf('Drive Folder ID');
    const statusCol = headers.indexOf('Record Status');
    const rowIdx = rows.findIndex((r, i) => i > 0 && (r[idCol] || '') === p.clientId);
    if (rowIdx === -1) return;
    const folderId = rows[rowIdx][folderCol];
    if (folderId) await moveFolderToLost(folderId);
    if (statusCol > -1) rows[rowIdx][statusCol] = 'Lost' + (p.lostReason ? ' - ' + p.lostReason : '');
    const newWs = XLSX.utils.aoa_to_sheet(rows);
    const newWb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(newWb, newWs, 'Client Records');
    if (wb.Sheets['Notes Log']) XLSX.utils.book_append_sheet(newWb, wb.Sheets['Notes Log'], 'Notes Log');
    const out = XLSX.write(newWb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${sheetId}?uploadType=media`, {
      method: 'PATCH', headers: { Authorization: `Bearer ${gdriveToken}`, 'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }, body: blob
    });
    showToast('Moved to Lost folder');
  } catch (e) {
    showToast('\u26A0\uFE0F Folder move failed — ' + e.message);
  }
}

function updateFollowUp(id, dateVal) {
  const p = findProspect(id);
  if (!p) return;
  p.nextFollowUp = dateVal || null;
  saveTracker();
}

// Deliberately avoids a full render() — that would rebuild every card from
// scratch and collapse whichever detail panel is currently open. Patches
// only the visible header text that could have changed instead.
function updateField(id, field, value) {
  const p = findProspect(id);
  if (!p) return;
  p[field] = (value || '').trim();
  saveTracker();
  if (p.clientId && p.status !== 'Won' && CLIENT_RECORD_SYNCED_FIELDS.has(field)) queueClientRecordSync(p);
  const detail = document.getElementById('detail-' + id);
  const card = detail ? detail.closest('.p-card') : null;
  if (card) {
    const nameEl = card.querySelector('.p-company');
    const metaEl = card.querySelector('.p-meta');
    if (nameEl) nameEl.textContent = p.company;
    if (metaEl) metaEl.textContent = `${p.state}${p.bdm ? ' · ' + p.bdm : ''}${p.contactName ? ' · ' + p.contactName : ''}`;
  }
}

let _lostTargetId = null;
function openLostModal(id) {
  _lostTargetId = id;
  document.getElementById('lostReasonSelect').value = '';
  document.getElementById('lostModal').classList.add('open');
}
function closeLostModal() {
  _lostTargetId = null;
  document.getElementById('lostModal').classList.remove('open');
}
function confirmMarkLost() {
  const reason = document.getElementById('lostReasonSelect').value;
  if (!reason) { showToast('Select a reason first'); return; }
  const p = findProspect(_lostTargetId);
  if (p) {
    p.status = 'Lost';
    p.lostReason = reason;
    p.lostDate = todayStr();
    saveTracker();
    if (p.clientId) {
      ensureToken().then(() => moveClientFolderOnLost(p)).catch(() => {
        showToast('\u26A0\uFE0F Could not move folder to Lost \u2014 mark it again to retry');
      });
    }
  }
  closeLostModal();
  render();
}

// =====================================================================
// PROMOTE TO CLIENT
// =====================================================================
function promoteToClient(id) {
  const p = findProspect(id);
  if (!p) return;
  // Once a Client ID exists (minted via Generate Quote), this is now a
  // real client record — open it in normal edit mode so nothing gets
  // duplicated. Only use the prefill-only path for a lead that's never
  // had a quote generated and has no Client ID yet.
  if (p.clientId) {
    // Hard gate — Customer ✓ and the Prospects→Clients folder move only
    // ever fire from the Won status change, never from completing the
    // client form itself. A soft "OK to bypass" warning here got read
    // backwards in practice — OK looked like "got it, I'll go do that"
    // when it actually meant "skip that and proceed anyway." Now a real
    // stop: no navigation happens at all until Won is actually set, and
    // there's no button here to misread either way.
    if (p.status !== 'Won') {
      alert(
        `${p.company} needs to be marked Won before completing client details.\n\n` +
        `Use the Status dropdown on this card to set it to Won \u2014 you'll be ` +
        `offered a direct link straight through to the client form right after.`
      );
      return;
    }
    window.location.href = `${PROSPECT_FORM_URL}/?client=${encodeURIComponent(p.clientId)}&name=${encodeURIComponent(p.company)}`;
    return;
  }
  const params = new URLSearchParams({
    promote: '1',
    company: p.company || '',
    contactName: p.contactName || '',
    contactPhone: p.contactPhone || '',
    contactEmail: p.contactEmail || '',
    state: p.state || '',
    trackerId: p.id
  });
  window.location.href = `${PROSPECT_FORM_URL}/?${params.toString()}`;
}

function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

function bucketFor(p) {
  if (!p.nextFollowUp) return 'nodate';
  if (p.nextFollowUp < todayStr()) return 'overdue';
  if (p.nextFollowUp === todayStr()) return 'today';
  return 'upcoming';
}

function statusOptionsHtml(current) {
  return STATUS_ORDER.map(s => `<option value="${s}" ${s===current?'selected':''}>${s}</option>`).join('');
}

function cardHtml(p) {
  const accent = STATUS_COLORS[p.status] || '#64d2ff';
  const bucket = bucketFor(p);
  const followUpClass = bucket === 'overdue' ? 'overdue' : bucket === 'today' ? 'today' : bucket === 'nodate' ? 'nodate' : 'upcoming';
  const followUpLabel = p.nextFollowUp
    ? (bucket === 'overdue' ? `Overdue by ${daysBetween(p.nextFollowUp, todayStr())} day${daysBetween(p.nextFollowUp, todayStr())!==1?'s':''}` : bucket === 'today' ? 'Due today' : 'Due ' + fmtDate(p.nextFollowUp))
    : (p.createdDate ? `No follow-up set \u2014 added ${daysBetween(p.createdDate, todayStr())} day${daysBetween(p.createdDate, todayStr())!==1?'s':''} ago` : 'No follow-up set');
  const activityHtml = (p.activity || []).slice().reverse().map(a => `
    <div class="activity-entry">
      <div class="activity-date">${fmtDate(a.date)}</div>
      <div class="activity-text">${escapeHtml(a.text)}</div>
    </div>`).join('') || '<div class="empty-note">No activity logged yet</div>';

  return `
  <div class="p-card" style="--accent:${accent};">
    <div class="p-card-top" onclick="toggleCard('${p.id}')">
      <div>
        <div class="p-company">${escapeHtml(p.company)}</div>
        <div class="p-meta">${p.state}${p.bdm ? ' · ' + escapeHtml(p.bdm) : ''}${p.contactName ? ' · ' + escapeHtml(p.contactName) : ''}</div>
        <div class="p-followup ${followUpClass}">${followUpLabel}</div>
      </div>
      <div class="p-status-badge">${p.status}</div>
    </div>
    <div class="p-detail" id="detail-${p.id}">
      <div class="p-field-row">
        <div>
          <label>Company</label>
          <input type="text" value="${escapeHtml(p.company)}" onchange="updateField('${p.id}','company',this.value)">
        </div>
        <div>
          <label>State</label>
          <select onchange="updateField('${p.id}','state',this.value)">
            ${p.state ? '' : '<option value="" selected>Select...</option>'}
            ${STATES.map(st => `<option value="${st}" ${p.state===st?'selected':''}>${st}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Street address</label>
          <input type="text" value="${escapeHtml(p.streetAddress||'')}" onchange="updateField('${p.id}','streetAddress',this.value)">
        </div>
        <div>
          <label>Suburb</label>
          <input type="text" value="${escapeHtml(p.suburb||'')}" onchange="updateField('${p.id}','suburb',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Postcode</label>

        <div>

        <div>
          <label>Period</label>

        <div>

          <input type="text" value="${escapeHtml(p.contactRole||'')}" placeholder="e.g. Fleet Manager" onchange="updateField('${p.id}','contactRole',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Phone</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="text" value="${escapeHtml(p.contactPhone||'')}" onchange="updateField('${p.id}','contactPhone',this.value)" style="flex:1;">
            <a href="#" onclick="callPhoneField(this);return false;" title="Call" style="flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(74,222,128,0.12);color:#4ADE80;text-decoration:none;font-size:15px;">\uD83D\uDCDE</a>
          </div>
        </div>
        <div>
          <label>Email</label>
          <input type="text" value="${escapeHtml(p.contactEmail||'')}" onchange="updateField('${p.id}','contactEmail',this.value)">
        </div>
      </div>
      ${p.contactName ? `<button class="qa-btn" style="width:100%;margin-bottom:4px;" onclick="saveContactVCard('${p.id}',1)">\uD83D\uDCC7 Save Site Contact to phone</button>` : ''}
      <div style="margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.35);">Key decision maker (optional)</div>
      <div class="p-field-row">
        <div>
          <label>Name</label>
          <input type="text" value="${escapeHtml(p.contact2Name||'')}" onchange="updateField('${p.id}','contact2Name',this.value)">
        </div>
        <div>
          <label>Role</label>
          <input type="text" value="${escapeHtml(p.contact2Role||'')}" placeholder="e.g. Site Manager" onchange="updateField('${p.id}','contact2Role',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Phone</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="text" value="${escapeHtml(p.contact2Phone||'')}" onchange="updateField('${p.id}','contact2Phone',this.value)" style="flex:1;">
            <a href="#" onclick="callPhoneField(this);return false;" title="Call" style="flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(74,222,128,0.12);color:#4ADE80;text-decoration:none;font-size:15px;">\uD83D\uDCDE</a>
          </div>
        </div>
        <div>
          <label>Email</label>
          <input type="text" value="${escapeHtml(p.contact2Email||'')}" onchange="updateField('${p.id}','contact2Email',this.value)">
        </div>
      </div>
      ${p.contact2Name ? `<button class="qa-btn" style="width:100%;margin-bottom:4px;" onclick="saveContactVCard('${p.id}',2)">\uD83D\uDCC7 Save Key Decision Maker to phone</button>` : ''}
      <div style="margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.35);">Other (optional)</div>
      <div class="p-field-row">
        <div>
          <label>Label</label>
          <input type="text" value="${escapeHtml(p.contact3Label||'')}" placeholder="e.g. Accounts, Broker" onchange="updateField('${p.id}','contact3Label',this.value)">
        </div>
        <div>
          <label>Name</label>
          <input type="text" value="${escapeHtml(p.contact3Name||'')}" onchange="updateField('${p.id}','contact3Name',this.value)">
        </div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Role</label>
          <input type="text" value="${escapeHtml(p.contact3Role||'')}" placeholder="e.g. HSE Manager" onchange="updateField('${p.id}','contact3Role',this.value)">
        </div>
        <div></div>
      </div>
      <div class="p-field-row">
        <div>
          <label>Phone</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="text" value="${escapeHtml(p.contact3Phone||'')}" onchange="updateField('${p.id}','contact3Phone',this.value)" style="flex:1;">
            <a href="#" onclick="callPhoneField(this);return false;" title="Call" style="flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(74,222,128,0.12);color:#4ADE80;text-decoration:none;font-size:15px;">\uD83D\uDCDE</a>

        <div>
          <label>Status</label>
          <select onchange="changeStatus('${p.id}', this.value)">${statusOptionsHtml(p.status)}</select>
        </div>
        <div>

          <input type="date" value="${p.nextFollowUp || ''}" onchange="updateFollowUp('${p.id}', this.value)">

      <div class="quick-actions">
        <button class="qa-btn" onclick="quickLogCall('${p.id}')">\u260E\uFE0F Call made</button>
        <button class="qa-btn" onclick="quickLogEmail('${p.id}')">\u2709\uFE0F Email sent</button>
        <button class="qa-btn" onclick="quickLogVisit('${p.id}')">\uD83E\uDD1D F2F visit</button>
        <button class="qa-btn promote" onclick="generateQuote('${p.id}')">${p.clientId ? '\u2192 Open quote builder' : '\u2192 Generate quote'}</button>
        <button class="qa-btn" onclick="promoteToClient('${p.id}')">Complete client details</button>
        <button class="qa-btn lost" onclick="openLostModal('${p.id}')">Mark lost</button>
      </div>
      <div class="activity-log">${activityHtml}</div>
      <div class="add-note-row">
        <input type="text" placeholder="Add a note..." onkeydown="if(event.key==='Enter'){addNote('${p.id}', this);}">
        <button class="btn btn-ghost" onclick="addNote('${p.id}', this.previousElementSibling)">Add</button>
      </div>
      ${p.lostReason ? `<div class="lost-reason-tag">Lost — ${escapeHtml(p.lostReason)}</div>` : ''}
      ${p.status === 'Won' && p.clientId ? `<div style="font-size:11px;color:#4ADE80;margin-top:8px;">Won \u2014 client details are now kept in the Prospect/Client form. Edits here no longer update Client Records.</div>` : ''}
    </div>
  </div>`;
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const visible = prospects.filter(p => {
    if (stateFilter !== 'ALL' && p.state !== stateFilter) return false;
    if (bdmFilter !== 'ALL' && p.bdm !== bdmFilter) return false;
    if (stageFilter !== 'ALL' && p.status !== stageFilter) return false;
    if (searchFilter) {
      const haystack = (p.company + ' ' + (p.contactName || '')).toLowerCase();
      if (!haystack.includes(searchFilter)) return false;
    }
    return true;
  });
  const active = visible.filter(p => p.status !== 'Lost');
  const lost   = visible.filter(p => p.status === 'Lost');

  // Stage strip counts reflect State/BDM/search but deliberately NOT the
  // stage filter itself — otherwise selecting one stage would zero out the
  // counts for every other stage, and there'd be no way to see them to
  // switch. Lost is excluded here too, it has its own section below.
  const forCounts = prospects.filter(p => {
    if (stateFilter !== 'ALL' && p.state !== stateFilter) return false;
    if (bdmFilter !== 'ALL' && p.bdm !== bdmFilter) return false;
    if (searchFilter) {
      const haystack = (p.company + ' ' + (p.contactName || '')).toLowerCase();
      if (!haystack.includes(searchFilter)) return false;
    }
    return p.status !== 'Lost';
  });
  const stageCounts = {};
  STATUS_ORDER.filter(s => s !== 'Lost').forEach(s => { stageCounts[s] = forCounts.filter(p => p.status === s).length; });
  renderStageStrip(stageCounts);

  // With a stage selected, sort every bucket newest-added-first instead of
  // by follow-up urgency — you're already looking at one stage, so "what's
  // most recent" matters more than "what's most overdue" within it. With
  // no stage selected, keep the original urgency-first behaviour.
  const byFollowUpAsc = (a,b) => a.nextFollowUp.localeCompare(b.nextFollowUp);
  const byCreatedOldest = (a,b) => (a.createdDate||'').localeCompare(b.createdDate||'');
  const byCreatedNewest = (a,b) => (b.createdDate||'').localeCompare(a.createdDate||'');
  const stageActive = stageFilter !== 'ALL';

  const overdue  = active.filter(p => bucketFor(p) === 'overdue').sort(stageActive ? byCreatedNewest : byFollowUpAsc);
  const today    = active.filter(p => bucketFor(p) === 'today').sort(stageActive ? byCreatedNewest : (() => 0));
  const upcoming = active.filter(p => bucketFor(p) === 'upcoming').sort(stageActive ? byCreatedNewest : byFollowUpAsc);
  const nodate   = active.filter(p => bucketFor(p) === 'nodate').sort(stageActive ? byCreatedNewest : byCreatedOldest);

  const section = (label, cls, list) => {
    if (!list.length) return '';
    return `<div class="section-label ${cls}">${label} <span class="section-count">${list.length}</span></div>` +
           list.map(cardHtml).join('');
  };

  const dash = document.getElementById('dashboard');
  const html = section('Overdue','overdue',overdue) + section('Due today','today',today) +
               section('Upcoming','upcoming',upcoming) + section('No follow-up set','nodate',nodate);
  const filterActive = stateFilter !== 'ALL' || bdmFilter !== 'ALL' || stageFilter !== 'ALL' || !!searchFilter;
  const emptyMsg = filterActive
    ? `No prospects match ${searchFilter ? `"${searchFilter}"` : 'that filter'} — try clearing the search or switching filters.`
    : 'No active prospects yet — add one above, or tap Load if you already have some in Drive.';
  dash.innerHTML = html || `<div class="empty-note">${emptyMsg}</div>`;

  document.getElementById('lostCount').textContent = lost.length;
  document.getElementById('lostWrap').innerHTML = lost.length
    ? lost.map(cardHtml).join('')
    : '<div class="empty-note">Nothing marked lost yet</div>';
}

populateBdmDropdowns();
populateStateDropdowns();
render();
</script>
